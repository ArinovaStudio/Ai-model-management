services:
  # -------------------------------------------------------------
  # 1. CACHE: Redis Container
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ai_planning_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - arinova_shared_net

  # -------------------------------------------------------------
  # 2. BACKEND: Headless Python FastAPI Application
  #    Uses the single Unified Ollama service running in Arinova-AI-BRAIN
  # -------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_planning_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379/0
      # Points to the single unified Ollama service hosted by Arinova-AI-BRAIN:
      - OLLAMA_BASE_URL=http://arinova_unified_ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3:8b}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-nomic-embed-text}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SOCKET_WEBHOOK_URL=http://arinova_socket_server:3001/api/webhook/planning-done
    depends_on:
      - redis
    command: >
      sh -c "python -m prisma db push && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped
    networks:
      - arinova_shared_net

networks:
  arinova_shared_net:
    name: arinova_shared_net
    external: true
