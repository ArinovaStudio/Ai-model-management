version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_planning_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    # This allows the backend to reach Ollama if it's running locally on the host machine
    # host.docker.internal works on Docker Desktop (Windows/Mac)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ai_planning_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai_planning_frontend
    ports:
      - "3000:80"
    restart: unless-stopped
    depends_on:
      - backend
      - redis
