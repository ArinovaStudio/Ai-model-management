<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aria • Voice Phone Agent</title>
  <meta name="description" content="Local-First Real Estate AI Voice Phone Agent">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>

  <main class="phone-wrapper">
    <div class="phone-card">
      
      <!-- Top Status Indicator -->
      <div class="status-header">
        <span class="pulse-indicator idle" id="statusDot"></span>
        <span id="callStatusText">Ready to Call</span>
      </div>

      <!-- Caller / Agent Header -->
      <div class="caller-profile">
        <div class="avatar-ring" id="avatarRing">
          <div class="avatar-core">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
              <line x1="12" y1="19" x2="12" y2="22"></line>
            </svg>
          </div>
        </div>
        <h1 class="agent-name">Aria</h1>
        <p class="agent-role">Real Estate Voice Assistant</p>
      </div>

      <!-- Phone Number Input & Duration Timer -->
      <div class="dialer-strip">
        <input type="text" id="phoneInput" value="+919876543210" placeholder="Enter phone number" class="phone-field">
        <div class="call-timer" id="callTimer">00:00</div>
      </div>

      <!-- Minimalist Audio Waveform Visualizer -->
      <div class="wave-container" id="waveContainer">
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
      </div>

      <!-- Live Captions Subtitle Box -->
      <div class="live-captions-box" id="captionsBox">
        <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
          <div class="caption-speaker" id="captionSpeaker">Aria</div>
          <div id="interruptBadge" class="interrupt-badge hidden" title="Click or press Spacebar to interrupt Aria">✋ Interrupt</div>
        </div>
        <p class="caption-text" id="captionText">Click the call button below to start talking.</p>
      </div>

      <!-- Phone Action Controls -->
      <div class="phone-actions">
        <!-- Mic Mute / Unmute -->
        <button class="action-btn" id="btnToggleMic" title="Toggle Microphone" disabled>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <line x1="12" y1="19" x2="12" y2="23"></line>
            <line x1="8" y1="23" x2="16" y2="23"></line>
          </svg>
        </button>

        <!-- Main Call / Hangup Button -->
        <button class="call-btn btn-call" id="btnCall" title="Call Aria">
          <svg id="callIcon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
          </svg>
        </button>

        <!-- Toggle Keyboard for Text Input -->
        <button class="action-btn" id="btnToggleKeyboard" title="Toggle Keyboard">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="4" width="20" height="16" rx="2" ry="2"></rect>
            <line x1="6" y1="8" x2="6" y2="8"></line>
            <line x1="10" y1="8" x2="10" y2="8"></line>
            <line x1="14" y1="8" x2="14" y2="8"></line>
            <line x1="18" y1="8" x2="18" y2="8"></line>
            <line x1="6" y1="12" x2="6" y2="12"></line>
            <line x1="10" y1="12" x2="10" y2="12"></line>
            <line x1="14" y1="12" x2="14" y2="12"></line>
            <line x1="18" y1="12" x2="18" y2="12"></line>
            <line x1="7" y1="16" x2="17" y2="16"></line>
          </svg>
        </button>
      </div>

      <!-- Optional Keyboard Fallback -->
      <div class="keyboard-input-container hidden" id="keyboardContainer">
        <input type="text" id="textPromptInput" placeholder="Type message to Aria...">
        <button id="btnSendText" class="send-text-btn">Send</button>
      </div>

    </div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
