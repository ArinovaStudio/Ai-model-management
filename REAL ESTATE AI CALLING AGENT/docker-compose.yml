version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: realestate_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-realestate_ai}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-realestate_ai}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  radicale:
    image: tomsquest/docker-radicale:latest
    container_name: realestate_caldav
    restart: unless-stopped
    ports:
      - "${CALDAV_PORT:-5232}:5232"
    volumes:
      - radicale_data:/data
      - ./docker/radicale/config:/config/config:ro
      - ./docker/radicale/users:/config/users:ro
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "-w", "%{http_code}", "http://localhost:5232/.web/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: realestate_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

volumes:
  postgres_data:
    name: realestate_postgres_data
  radicale_data:
    name: realestate_radicale_data
  redis_data:
    name: realestate_redis_data
